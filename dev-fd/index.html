<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dev-FD</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="content">
            <div id="sensorScans">
                <span>Sensors</span>
                <div id="incomingScanContainer">
                    I'm a scanny box
                </div>
                <div id="responseContainer">
                    <textarea name="scanResponse" id="scanResponse"></textarea>
                </div>
                <div id="sensorButtonContainer">
                    <button id="sendResponse" class="primaryButton">Send Response</button>
                    <button id="sendData" class="alertButton">Send Processed Data</button>
                </div>
            </div>
        </div>

        <script type="module" src="index.js"></script>
    </body>
</html>
