<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dev Software Panel</title>
        <link rel="stylesheet" href="index.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
      <div id="rowOne">
        <div id="positronicInterface">
          <span class="sectionHeading" id="positronicHeading">Positronic Interface</span>
          <div id="positronicSwitchContainer">
            <div class="switchesRow" id="switchesRowOne">
              <div class="switchWrapper">
                <div id="alpha-1" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Alpha - 1</div>
              </div>
              <div class="switchWrapper">
                <div id="alpha-2" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Alpha - 2</div>
              </div>
              <div class="switchWrapper">
                <div id="alpha-3" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Alpha - 3</div>
              </div>
              <div class="switchWrapper">
                <div id="alpha-4" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Alpha - 4</div>
              </div>
              <div class="switchWrapper">
                <div id="alpha-5" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Alpha - 5</div>
              </div>
              <div class="switchWrapper">
                <div id="alpha-6" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Alpha - 6</div>
              </div>
            </div>
            <div class="switchesRow" id="switchesRowTwo">
              <div class="switchWrapper">
                <div id="bravo-1" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Bravo - 1</div>
              </div>
              <div class="switchWrapper">
                <div id="bravo-2" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Bravo - 2</div>
              </div>
              <div class="switchWrapper">
                <div id="bravo-3" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Bravo - 3</div>
              </div>
              <div class="switchWrapper">
                <div id="bravo-4" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Bravo - 4</div>
              </div>
              <div class="switchWrapper">
                <div id="bravo-5" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Bravo - 5</div>
              </div>
              <div class="switchWrapper">
                <div id="bravo-6" class="switch" onclick="toggleSwitch(this)">
                  <div class="led"></div>
                  <div class="base"></div>
                  <div class="lever"></div>
                </div>
                <div class="switchLabel">Bravo - 6</div>
              </div>
            </div>
            <button id="configurePositronicInterface">Configure Positronic Interface</button>
          </div>
        </div>
        <div id="signalCalibration">
          <span class="sectionHeading" id="signalCalibrationHeading">Signal Calibration</span>
          <div id="signalCalibrationContainer">
            <div class="verticalCenteredContainer">
              <span class="sectionHeadingTwo">Internal Signal Calibration</span>
              <div id="internalSignalCalibrationContainer">
                <div class="circle-wrapper">
                  <div id="internalCircleDisplay" class="circle-display">
                    <span id="internalCircleText" class="circle-text">0%</span>
                  </div>

                  <div id="rcx-i-1" class="ring-led ring-led-1"></div>
                  <div id="lec-i-1" class="ring-led ring-led-2"></div>
                  <div id="gvd-i-1" class="ring-led ring-led-3"></div>
                  <div id="rcx-i-2" class="ring-led ring-led-4"></div>
                  <div id="lec-i-2" class="ring-led ring-led-5"></div>
                  <div id="gvd-i-2" class="ring-led ring-led-6"></div>
                  <div id="rcx-i-3" class="ring-led ring-led-7"></div>
                  <div id="lec-i-3" class="ring-led ring-led-8"></div>
                  <div id="gvd-i-3" class="ring-led ring-led-9"></div>
                </div>

                <div class="slider-wrapper">
                  <input type="range" id="internalSignalSlider" class="slider" min="0" max="100" value="0" />
                </div>
              </div>
              <div id="internalSignalButtonsContainer">
                <button id="rcx-i" class="signal-button">RCX-I</button>
                <button id="lec-i" class="signal-button">LEC-I</button>
                <button id="gvd-i" class="signal-button">GVD-I</button>
              </div> 
            </div>
            <div class="verticalCenteredContainer">
              <span class="sectionHeadingTwo">External Signal Calibration</span>
              <div id="externalSignalCalibrationContainer">
                <div class="slider-wrapper">
                  <input type="range" id="externalSignalSlider" class="slider" min="0" max="100" value="0" />
                </div>

                <div class="circle-wrapper">
                  <div id="externalCircleDisplay" class="circle-display">
                    <span id="externalCircleText" class="circle-text">0%</span>
                  </div>

                  <div id="rcx-e-1" class="ring-led ring-led-1"></div>
                  <div id="lec-e-1" class="ring-led ring-led-2"></div>
                  <div id="gvd-e-1" class="ring-led ring-led-3"></div>
                  <div id="rcx-e-2" class="ring-led ring-led-4"></div>
                  <div id="lec-e-2" class="ring-led ring-led-5"></div>
                  <div id="gvd-e-2" class="ring-led ring-led-6"></div>
                  <div id="rcx-e-3" class="ring-led ring-led-7"></div>
                  <div id="lec-e-3" class="ring-led ring-led-8"></div>
                  <div id="gvd-e-3" class="ring-led ring-led-9"></div>
                </div>
              </div>
              <div id="externalSignalButtonsContainer">
                <button id="rcx-e" class="signal-button">RCX-E</button>
                <button id="lec-e" class="signal-button">LEC-E</button>
                <button id="gvd-e" class="signal-button">GVD-E</button>
              </div>  
            </div>                  
          </div>             
        </div>
      </div>
      <div id="rowTwo">
        <div class="arc-gauge-wrapper">
          <div class="arc-gauge">
            <div class="ticks-arc" id="ticksArc"></div>
            <div class="needle" id="needle"></div>
            <div class="needle-center"></div>
          </div>
          <div class="gauge-value" id="gaugeValue">0%</div>
        </div>                                 
      </div>
      
      <script src="index.js"></script>
    </body>
</html>
